<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpeedPulse — Internet Speed Test</title>
    <meta name="description" content="SpeedPulse: self-hosted, highly reliable internet speed test. Measures download, upload, ping and jitter — all data stays in RAM, no external APIs.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Animated background blobs -->
    <div class="bg-orb orb-1" aria-hidden="true"></div>
    <div class="bg-orb orb-2" aria-hidden="true"></div>
    <div class="bg-orb orb-3" aria-hidden="true"></div>
    <div class="bg-orb orb-4" aria-hidden="true"></div>

    <div class="app-container">

        <!-- Header ──────────────────────────────────────── -->
        <header class="site-header" id="site-header">
            <div class="logo">
                <svg class="logo-icon" viewBox="0 0 32 32" width="36" height="36" fill="none">
                    <circle cx="16" cy="16" r="14" stroke="url(#logoGrad)" stroke-width="2.5"/>
                    <path d="M10 20 L16 8 L18 16 L24 16" stroke="url(#logoGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <defs>
                        <linearGradient id="logoGrad" x1="0" y1="0" x2="32" y2="32">
                            <stop offset="0%" stop-color="#00d4ff"/>
                            <stop offset="100%" stop-color="#7c3aed"/>
                        </linearGradient>
                    </defs>
                </svg>
                <h1>SpeedPulse</h1>
            </div>
            <p class="tagline">Self-Hosted &middot; Reliable &middot; No External APIs</p>
        </header>

        <!-- Main ────────────────────────────────────────── -->
        <main class="main-content">

            <!-- Gauge -->
            <section class="gauge-section" id="gauge-section">
                <div class="gauge-wrapper" id="gauge-wrapper">
                    <canvas id="gauge-canvas"></canvas>
                    <div class="gauge-center-overlay">
                        <div class="speed-display">
                            <span class="speed-value" id="speed-value">0</span>
                            <span class="speed-unit" id="speed-unit">Mbps</span>
                        </div>
                        <span class="test-phase" id="test-phase">Ready</span>
                    </div>
                </div>
            </section>

            <!-- Start / Progress -->
            <section class="action-section" id="action-section">
                <button class="start-btn" id="start-btn" type="button">
                    <span class="btn-icon" id="btn-icon">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="5,3 19,12 5,21"/>
                        </svg>
                    </span>
                    <span class="btn-text" id="btn-text">Start Test</span>
                </button>
            </section>

            <!-- Progress bar (visible during test) -->
            <div class="progress-bar-wrapper" id="progress-bar-wrapper">
                <div class="progress-bar-track">
                    <div class="progress-bar-fill" id="progress-bar-fill"></div>
                </div>
                <span class="progress-label" id="progress-label">0 %</span>
            </div>

            <!-- Result cards -->
            <section class="results-section" id="results-section">
                <div class="result-card" id="card-ping">
                    <div class="card-icon ping-icon">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 20v-6"/><path d="M6 20v-2"/><path d="M18 20v-4"/>
                            <circle cx="12" cy="10" r="2"/>
                            <path d="M8.5 6.5a5.5 5.5 0 0 1 7 0"/>
                            <path d="M5.5 3.5a10 10 0 0 1 13 0"/>
                        </svg>
                    </div>
                    <div class="card-label">Ping</div>
                    <div class="card-value" id="ping-value">&mdash;</div>
                    <div class="card-unit">ms</div>
                </div>

                <div class="result-card" id="card-jitter">
                    <div class="card-icon jitter-icon">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="2,12 6,8 10,16 14,6 18,14 22,10"/>
                        </svg>
                    </div>
                    <div class="card-label">Jitter</div>
                    <div class="card-value" id="jitter-value">&mdash;</div>
                    <div class="card-unit">ms</div>
                </div>

                <div class="result-card highlight-card" id="card-download">
                    <div class="card-icon download-icon">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 3v12"/><polyline points="6,11 12,17 18,11"/><path d="M4 21h16"/>
                        </svg>
                    </div>
                    <div class="card-label">Download</div>
                    <div class="card-value" id="download-value">&mdash;</div>
                    <div class="card-unit">Mbps</div>
                </div>

                <div class="result-card highlight-card" id="card-upload">
                    <div class="card-icon upload-icon">
                        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 21V9"/><polyline points="18,13 12,7 6,13"/><path d="M4 3h16"/>
                        </svg>
                    </div>
                    <div class="card-label">Upload</div>
                    <div class="card-value" id="upload-value">&mdash;</div>
                    <div class="card-unit">Mbps</div>
                </div>
            </section>

            <!-- Connection info -->
            <section class="info-section" id="info-section">
                <div class="info-item">
                    <span class="info-label">Server</span>
                    <span class="info-value" id="server-info">SpeedPulse (Self-Hosted)</span>
                </div>
                <div class="info-divider"></div>
                <div class="info-item">
                    <span class="info-label">Your IP</span>
                    <span class="info-value" id="ip-info">Detecting…</span>
                </div>
                <div class="info-divider"></div>
                <div class="info-item">
                    <span class="info-label">Connection</span>
                    <span class="info-value" id="connection-info">&mdash;</span>
                </div>
            </section>
        </main>

        <!-- Footer ──────────────────────────────────────── -->
        <footer class="site-footer">
            <p>All data generated &amp; stored in RAM &middot; Zero external APIs &middot; Self-hosted reliability</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
